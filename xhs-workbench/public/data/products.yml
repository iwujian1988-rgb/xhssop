products:
  delf_b2_writing:
    name: DELF B2 写作资料包
    public_name_options:
    - DELF B2 写作资料包
    - B2 写作范文句型训练包
    - DELF B2 写作提分讲义
    core_audience:
    - DELF B2 考生
    - B1 到 B2 过渡阶段
    - 背范文但不会迁移的人
    - 写作写不出 B2 感的人
    - 临考前想系统整理写作的人
    preset_selling_points:
    - id: 20_essays
      name: 20 篇多主题范文
      suitable_angles:
      - 范文拆解
      - 范文不是整篇背
      - 多主题备考
    - id: 240_replacements
      name: 240 条 B2 替换词
      suitable_angles:
      - 普通词换 B2 表达
      - important 替换
      - 写作不够高级
    - id: 100_sentence_patterns
      name: 100 条实用句法
      suitable_angles:
      - 观点展开
      - 让步转折
      - 句子结构升级
    - id: topic_opinions
      name: 主题观点库
      suitable_angles:
      - 观点空
      - 不知道写什么立场
    - id: mistake_contrast
      name: 错题对照
      suitable_angles:
      - 普通写法 vs B2 写法
      - 看着没错但不像 B2
    - id: writing_checklist
      name: 写作检查清单
      suitable_angles:
      - 考前检查
      - 写完自查
    seo_keywords:
      core:
      - DELF B2
      - DELF B2 写作
      - 法语 B2
      - 法语写作
      long_tail:
      - DELF B2 写作范文
      - DELF B2 写作模板
      - 法语 B2 作文
      - 法语写作替换词
      - DELF B2 production écrite
